name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-installer.yml
      - apps/windows-agent/**
      - packages/telemetry-schema/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the Windows agent
        run: uv sync --frozen --all-packages --package coach-agent --extra desktop

      - name: Build the application directory
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean --distpath apps/windows-agent/dist --workpath apps/windows-agent/build apps/windows-agent/packaging/coach-agent.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          & $iscc "apps\windows-agent\packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AssettoCorsaCoachAgent-Setup
          path: apps/windows-agent/packaging/Output/AssettoCorsaCoachAgent-Setup.exe
          if-no-files-found: error
          retention-days: 14
