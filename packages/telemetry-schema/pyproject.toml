[project]
name = "telemetry-schema"
version = "0.1.0"
description = "Versioned telemetry messages for Assetto Corsa Coach"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry_schema"]
