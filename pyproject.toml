[project]
name = "assetto-corsa-coach"
version = "0.1.0"
description = "Local-first driving coach for original Assetto Corsa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/telemetry-schema",
  "apps/windows-agent",
  "apps/backend",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = [
  "packages/telemetry-schema/tests",
  "apps/windows-agent/tests",
  "apps/backend/tests",
]
addopts = "-q --import-mode=importlib"
